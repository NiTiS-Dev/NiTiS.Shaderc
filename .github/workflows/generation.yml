name: Generation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

jobs:
  update-shaderc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Get current submodule hash
        id: submodule-hash
        run: |
          echo "hash_before=$(git submodule status | sha256sum | cut -d ' ' -f 1)" >> $GITHUB_OUTPUT

      - name: Update submodules
        run: git submodule update --remote --recursive

      - name: Get updated submodule hash
        id: submodule-hash-after
        run: |
          echo "hash_after=$(git submodule status | sha256sum | cut -d ' ' -f 1)" >> $GITHUB_OUTPUT

      - name: Check if submodules changed
        id: check-changes
        run: |
          if [ "${{ steps.submodule-hash.outputs.hash_before }}" != "${{ steps.submodule-hash-after.outputs.hash_after }}" ]; then
            echo "submodules_changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in submodules"
            git submodule status
          else
            echo "submodules_changed=false" >> $GITHUB_OUTPUT
            echo "No changes in submodules"
          fi

      - name: Commit submodule updates
        if: steps.check-changes.outputs.submodules_changed == 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto-update: Update submodules"
          git push

  generate-code:
    needs: update-shaderc
    if: ${{ needs.update-shaderc.outputs.submodules_changed == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest # Due to https://github.com/dotnet/ClangSharp/issues/586
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Remove previous generated code
        run: rm ./src/NiTiS.Shaderc/LowLevel/*.cs
        continue-on-error: true

      - name: Generate code
        run: |
          dotnet tool restore
          dotnet tool run ClangSharpPInvokeGenerator -l shaderc_shared -c preview-codegen multi-file generate-cpp-attributes generate-doc-includes generate-file-scoped-namespaces generate-helper-types log-exclusions log-potential-typedef-remappings log-visited-files -I ./3rd-party/shaderc/libshaderc/include/ -f ./3rd-party/shaderc/libshaderc/include/shaderc/shaderc.h ./3rd-party/shaderc/libshaderc/include/shaderc/env.h ./3rd-party/shaderc/libshaderc/include/shaderc/status.h --remap shaderc_compilation_status=@CompilationStatus shaderc_env_version=@EnvironmentVersion shaderc_include_type=@IncludeType shaderc_limit=@Limit shaderc_optimization_level=@OptimizationLevel shaderc_profile=@Profile shaderc_shader_kind=@ShaderKind shaderc_source_language=@SourceLanguage shaderc_spirv_version=@SpirvVersion shaderc_target_env=@TargetEnvironment shaderc_uniform_kind=@UniformKind -e shaderc_compilation_status shaderc_env_version shaderc_include_type shaderc_limit shaderc_optimization_level shaderc_profile shaderc_shader_kind shaderc_source_language shaderc_spirv_version shaderc_spirv_version shaderc_target_env shaderc_uniform_kind --methodClassName ShadercApi --namespace NiTiS.Shaderc.LowLevel --output ./src/NiTiS.Shaderc/LowLevel/ --prefixStrip shaderc_

      - name: Commit generated code
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto-update: update CSharp sources"
          git push

